# Rootless Podman inside the ai-box container (no systemd, no /dev/net/tun).
[containers]
# crun creates a session keyring per container; that needs keyctl, which the box seccomp profile does not allow.
keyring = false
# Project containers share the box's network: slirp4netns / pasta need /dev/net/tun, which the box does not get.
netns = "host"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
